<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire Earth replay viewer</title>
<style>
  :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 12px; background: #15171a; color: #e6e6e6; }
  #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  button, input[type=number] { font: inherit; }
  #counter { font-variant-numeric: tabular-nums; min-width: 9ch; }
  #slider { flex: 1 1 160px; }
  canvas { display: block; max-width: 100%; height: auto; background: #000; image-rendering: pixelated; }
  #status { margin: 8px 0 0; min-height: 1.4em; white-space: pre-wrap; }
  #drop { opacity: .7; font-size: .9em; }
</style>
</head>
<body>
<div id="bar">
  <button id="play">Play</button>
  <button id="step">Step</button>
  <button id="restart">Restart</button>
  <span id="counter">frame 0 / 0</span>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="frame">
  <label>fps <input id="fps" type="number" min="1" max="120" value="30" style="width:4em"></label>
  <label><input id="loop" type="checkbox"> loop</label>
  <button id="demo">Demo</button>
  <label>Open <input id="file" type="file" accept=".json"></label>
</div>
<canvas id="screen" width="640" height="480"></canvas>
<p id="status"></p>
<p id="drop">Drop a local file on this page. Nothing is uploaded and nothing is fetched from the network.</p>
<script>
  if (location.protocol === "file:") document.getElementById("status").textContent =
    "Opened from file://: browsers block ES modules there. Run `make serve-web` and open http://localhost:8000/ instead.";
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
